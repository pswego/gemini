<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Gemini Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
:root{
  --bg:#0f1116; --surface:#161922; --surface-2:#1c2029; --border:#282d3a;
  --text:#e7e9f0; --muted:#9096a8; --faint:#6b7185;
  --accent:#d9a441; --accent-soft:rgba(217,164,65,.14); --accent-line:rgba(217,164,65,.4);
  --user:#232834; --danger:#e5675f; --ok:#5fb98a;
  --font-ui:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sidebar-w:270px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3140;border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a4152}

/* layout */
.app{display:flex;height:100dvh}

/* sidebar */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  transition:margin-left .22s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand .mark{width:26px;height:26px;flex:0 0 26px}
.brand h1{font-family:var(--font-ui);font-size:16px;font-weight:600;letter-spacing:.2px;margin:0}
.brand small{display:block;color:var(--faint);font-size:11px;font-weight:400;letter-spacing:.3px}
.newchat{
  margin:4px 12px 10px;padding:10px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-family:var(--font-ui);font-weight:500;font-size:14px;
  display:flex;align-items:center;gap:8px;transition:border-color .15s,background .15s;
}
.newchat:hover{border-color:var(--accent-line);background:#20242f}
.newchat svg{color:var(--accent)}
.sessions{flex:1;overflow-y:auto;padding:4px 8px 8px}
.sess-empty{color:var(--faint);font-size:13px;padding:14px 8px}
.sess{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;
  color:var(--text);cursor:pointer;position:relative;margin-bottom:2px;
}
.sess:hover{background:var(--surface-2)}
.sess.active{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
.sess .t{flex:1;min-width:0;font-family:var(--font-ui);font-weight:500;font-size:13.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .acts{display:none;gap:2px}
.sess:hover .acts,.sess.active .acts{display:flex}
.icobtn{background:none;border:none;color:var(--muted);padding:4px;border-radius:6px;display:flex}
.icobtn:hover{color:var(--text);background:#2a3040}
.icobtn.danger:hover{color:var(--danger)}
.sidebar-foot{padding:10px 12px;border-top:1px solid var(--border)}
.settings-btn{
  width:100%;padding:9px 10px;border-radius:8px;border:1px solid transparent;background:none;
  color:var(--muted);display:flex;align-items:center;gap:8px;font-size:13.5px;
}
.settings-btn:hover{background:var(--surface-2);color:var(--text)}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{
  height:56px;flex:0 0 56px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(15,17,22,.7);
  backdrop-filter:blur(8px);
}
.hamb{display:none;background:none;border:none;color:var(--text);padding:6px}
.model-select{position:relative}
.model-select select{
  appearance:none;background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  padding:8px 34px 8px 12px;border-radius:8px;font-family:var(--font-ui);font-weight:500;font-size:13.5px;
}
.model-select::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-70%) rotate(45deg);pointer-events:none}
.topbar .spacer{flex:1}
.badge{font-size:11px;color:var(--faint);font-family:var(--font-mono)}

/* chat scroll */
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:820px;margin:0 auto;padding:26px 22px 8px}

/* empty state */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:6px}
.empty .orbit{width:56px;height:56px;opacity:.9;margin-bottom:8px}
.empty h2{font-family:var(--font-ui);font-weight:600;font-size:22px;margin:0}
.empty p{color:var(--muted);margin:2px 0 18px;max-width:360px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:9px 13px;border-radius:20px;font-size:13px}
.chip:hover{border-color:var(--accent-line)}

/* messages */
.msg{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid rgba(40,45,58,.5)}
.msg:last-child{border-bottom:none}
.avatar{width:28px;height:28px;flex:0 0 28px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-family:var(--font-ui);font-weight:600;font-size:13px}
.msg.user .avatar{background:var(--user);color:var(--muted)}
.msg.model .avatar{background:var(--accent-soft);color:var(--accent)}
.bubble{flex:1;min-width:0;padding-top:2px}
.who{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--muted);margin-bottom:3px}
.msg.model .who{color:var(--accent)}
.content{overflow-wrap:anywhere}
.content p{margin:.55em 0}
.content p:first-child{margin-top:0}
.content ul,.content ol{margin:.5em 0;padding-left:1.4em}
.content li{margin:.2em 0}
.content h1,.content h2,.content h3{font-family:var(--font-ui);margin:1em 0 .4em;line-height:1.3}
.content h1{font-size:1.35em}.content h2{font-size:1.2em}.content h3{font-size:1.05em}
.content a{color:var(--accent)}
.content blockquote{border-left:3px solid var(--border);margin:.6em 0;padding:.1em 1em;color:var(--muted)}
.content table{border-collapse:collapse;margin:.6em 0;width:100%;font-size:.93em}
.content th,.content td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.content th{background:var(--surface-2)}
.content code:not(pre code){background:var(--surface-2);padding:.12em .4em;border-radius:5px;
  font-family:var(--font-mono);font-size:.86em}
.codeblock{margin:.7em 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#0b0d12}
.codeblock .cbhead{display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px 6px 12px;background:var(--surface-2);font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.codeblock .cbacts{display:flex;gap:4px}
.codeblock pre{margin:0;padding:14px;overflow-x:auto}
.codeblock code{font-family:var(--font-mono);font-size:13px;line-height:1.5}
.attach-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.attach-grid img{max-width:230px;max-height:230px;border-radius:10px;border:1px solid var(--border)}
.filechip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12.5px}
.filechip svg{color:var(--accent)}
.gen-img{max-width:100%;border-radius:12px;border:1px solid var(--border);margin:.4em 0;display:block}
.img-dl{margin:.2em 0 .6em;font-size:12.5px}
.cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.thinking{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* composer */
.composer-wrap{padding:8px 22px 18px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.composer{max-width:820px;margin:0 auto;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:8px 8px 8px 14px;transition:border-color .15s}
.composer:focus-within{border-color:var(--accent-line)}
.pending{display:flex;flex-wrap:wrap;gap:8px;padding:6px 4px 8px}
.pending .pv{position:relative}
.pending img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.pending .pf{display:flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;max-width:180px}
.pending .pf span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pending .x{position:absolute;top:-6px;right:-6px;background:#000;border:1px solid var(--border);
  color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}
.composer .row{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;background:none;border:none;color:var(--text);resize:none;
  font-family:var(--font-body);font-size:15px;line-height:1.5;max-height:200px;padding:8px 4px;outline:none}
.composer textarea::placeholder{color:var(--faint)}
.attach-btn{background:none;border:none;color:var(--muted);padding:8px;border-radius:9px;display:flex}
.attach-btn:hover{color:var(--text);background:var(--surface-2)}
.send{width:38px;height:38px;flex:0 0 38px;border:none;border-radius:10px;background:var(--accent);
  color:#1a1300;display:flex;align-items:center;justify-content:center;transition:transform .1s,opacity .15s}
.send:disabled{opacity:.4;cursor:default}
.send:not(:disabled):hover{transform:translateY(-1px)}
.send.stop{background:var(--danger);color:#fff}
.hint{max-width:820px;margin:6px auto 0;text-align:center;color:var(--faint);font-size:11.5px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;
  justify-content:center;padding:20px;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:22px}
.modal h3{font-family:var(--font-ui);margin:0 0 4px;font-size:18px}
.modal .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.field{margin-bottom:16px}
.field label{display:block;font-family:var(--font-ui);font-weight:500;font-size:13px;margin-bottom:6px}
.field .desc{color:var(--faint);font-size:12px;margin:-2px 0 7px}
.field input,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:10px 12px;font-family:var(--font-body);font-size:14px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent-line)}
.field textarea{resize:vertical;min-height:64px;font-family:var(--font-mono);font-size:12.5px}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btn{padding:10px 18px;border-radius:9px;font-family:var(--font-ui);font-weight:500;font-size:14px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
.btn:hover{background:#222735}
.btn.primary{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.btn.primary:hover{opacity:.92}
.keylink{color:var(--accent);font-size:12px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 16px;
  border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--danger)}

.scrim{display:none}
@media(max-width:820px){
  .sidebar{position:fixed;z-index:40;height:100dvh;margin-left:calc(-1 * var(--sidebar-w))}
  .sidebar.open{margin-left:0;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .hamb{display:flex}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}
  .scrim.open{display:block}
  .thread,.composer,.hint{max-width:100%}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="4" fill="#d9a441"/>
        <ellipse cx="20" cy="20" rx="17" ry="7" stroke="#d9a441" stroke-width="1.6" opacity=".9"/>
        <ellipse cx="20" cy="20" rx="17" ry="7" stroke="#d9a441" stroke-width="1.6" opacity=".55" transform="rotate(60 20 20)"/>
        <ellipse cx="20" cy="20" rx="17" ry="7" stroke="#d9a441" stroke-width="1.6" opacity=".35" transform="rotate(120 20 20)"/>
      </svg>
      <div>
        <h1>Gemini Console</h1>
        <small>개인 AI 작업실</small>
      </div>
    </div>
    <button class="newchat" id="newChat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      새 대화
    </button>
    <div class="sessions" id="sessions"></div>
    <div class="sidebar-foot">
      <button class="settings-btn" id="openSettings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        설정
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <button class="hamb" id="hamb" aria-label="메뉴">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="model-select">
        <select id="modelSel"></select>
      </div>
      <div class="spacer"></div>
      <span class="badge" id="modeBadge"></span>
    </div>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="pending" id="pending" style="display:none"></div>
        <div class="row">
          <button class="attach-btn" id="attachBtn" aria-label="파일 첨부" title="이미지·PDF·파일 첨부">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="fileInput" multiple hidden accept="image/*,application/pdf,.txt,.md,.csv,.json,.js,.py,.html,.css,.ts,.java,.c,.cpp,.go,.rs,.sh,.xml,.yaml,.yml">
          <textarea id="input" rows="1" placeholder="메시지를 입력하세요 (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
          <button class="send" id="send" disabled aria-label="전송">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </main>
</div>

<!-- SETTINGS MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>설정</h3>
    <p class="sub">모두 이 브라우저 안에만 저장됩니다. 서버로 전송되지 않아요.</p>
    <div class="field">
      <label>Google AI Studio API 키</label>
      <p class="desc">키가 없으면 <a class="keylink" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> 에서 발급하세요.</p>
      <input type="password" id="apiKey" placeholder="AIza...">
    </div>
    <div class="field">
      <label>모델 목록</label>
      <p class="desc">한 줄에 하나씩. 상단 드롭다운에 나타납니다. 이름에 "image"가 들어가면 이미지 생성 모델로 처리됩니다.</p>
      <textarea id="modelList" rows="6"></textarea>
    </div>
    <div class="field">
      <label>시스템 프롬프트 (선택)</label>
      <p class="desc">어시스턴트의 기본 성격·규칙. 모든 대화에 적용됩니다.</p>
      <textarea id="sysPrompt" rows="3" placeholder="예: 너는 간결하고 정확하게 답하는 개발 어시스턴트다."></textarea>
    </div>
    <div class="modal-acts">
      <button class="btn" id="cancelSettings">취소</button>
      <button class="btn primary" id="saveSettings">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- config ---------- */
const DEFAULT_MODELS = [
  "gemini-3.6-flash",
  "gemini-3.1-pro",
  "gemini-3.5-flash-lite",
  "gemini-3-pro-image",
  "gemini-3.1-flash-image"
];
const API_BASE = "https://generativelanguage.googleapis.com/v1beta/models/";
const LABELS = {
  "gemini-3.6-flash":"3.6 Flash · 기본",
  "gemini-3.1-pro":"3.1 Pro · 고성능",
  "gemini-3.5-flash-lite":"3.5 Flash-Lite · 저비용",
  "gemini-3-pro-image":"이미지 생성 · Pro",
  "gemini-3.1-flash-image":"이미지 생성 · Flash"
};
const isImageModel = m => /image/i.test(m);

/* ---------- settings (localStorage) ---------- */
const S = {
  get apiKey(){return localStorage.getItem("gc_key")||""},
  set apiKey(v){localStorage.setItem("gc_key",v)},
  get models(){try{return JSON.parse(localStorage.getItem("gc_models"))||DEFAULT_MODELS}catch{return DEFAULT_MODELS}},
  set models(v){localStorage.setItem("gc_models",JSON.stringify(v))},
  get sys(){return localStorage.getItem("gc_sys")||""},
  set sys(v){localStorage.setItem("gc_sys",v)},
  get model(){return localStorage.getItem("gc_model")||S.models[0]},
  set model(v){localStorage.setItem("gc_model",v)}
};

/* ---------- IndexedDB (conversations) ---------- */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("gemini_console",1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains("convos"))
        d.createObjectStore("convos",{keyPath:"id"});
    };
    r.onsuccess=e=>{db=e.target.result;res()};
    r.onerror=e=>rej(e.target.error);
  });
}
function tx(mode){return db.transaction("convos",mode).objectStore("convos")}
function dbPut(c){return new Promise((res,rej)=>{const q=tx("readwrite").put(c);q.onsuccess=res;q.onerror=e=>rej(e.target.error)})}
function dbDel(id){return new Promise((res,rej)=>{const q=tx("readwrite").delete(id);q.onsuccess=res;q.onerror=e=>rej(e.target.error)})}
function dbAll(){return new Promise((res,rej)=>{const q=tx("readonly").getAll();q.onsuccess=e=>res(e.target.result||[]);q.onerror=e=>rej(e.target.error)})}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);

    r.readAsDataURL(file);
  });
}
async function addFiles(files){

    if(f.size>18*1024*1024){toast(f.name+": 18MB 초과, 건너뜀",true);continue}

      pending.push({mimeType:mime,data,name:f.name,kind:mime.startsWith("image/")?"img":"file"});
    }catch{toast(f.name+" 읽기 실패",true)}

/* ---------- API call ---------- */
function buildContents(){
  // full history -> Gemini contents
  const contents=[];
  for(const msg of current.messages){
    const parts=msg.parts.map(p=>{
      if(p.text!=null)return {text:p.text};
      if(p.inlineData)return {inlineData:{mimeType:p.inlineData.mimeType,data:p.inlineData.data}};
      return null;
    }).filter(Boolean);
    if(parts.length)contents.push({role:msg.role,parts});
  }
  return contents;
}

async function callStream(model,contents,onDelta,signal){
  const body={contents};
  if(S.sys.trim())body.systemInstruction={parts:[{text:S.sys}]};
  const url=API_BASE+encodeURIComponent(model)+":streamGenerateContent?alt=sse&key="+encodeURIComponent(S.apiKey);
  const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal});
  if(!resp.ok){throw new Error(await readErr(resp))}
  const reader=resp.body.getReader();const dec=new TextDecoder();let buf="";
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
      if(!line.startsWith("data:"))continue;
      const json=line.slice(5).trim();
      if(!json)continue;
      try{
        const obj=JSON.parse(json);
        const parts=obj?.candidates?.[0]?.content?.parts||[];
        for(const p of parts){if(p.text)onDelta({text:p.text});else if(p.inlineData)onDelta({inlineData:p.inlineData})}
      }catch{}
    }
  }
}
async function callImage(model,contents,signal){
  const body={contents,generationConfig:{responseModalities:["TEXT","IMAGE"]}};
  if(S.sys.trim())body.systemInstruction={parts:[{text:S.sys}]};
  const url=API_BASE+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(S.apiKey);
  const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal});
  if(!resp.ok){throw new Error(await readErr(resp))}
  const obj=await resp.json();
  return obj?.candidates?.[0]?.content?.parts||[];
}
async function readErr(resp){
  try{const j=await resp.json();return (j.error&&j.error.message)||("HTTP "+resp.status)}catch{return "HTTP "+resp.status}
}

/* ---------- send ---------- */
async function send(){
  if(streaming){if(controller)controller.abort();return}
  const text=$("input").value.trim();
  if(!text&&!pending.length)return;
  if(!S.apiKey){openSettings();toast("먼저 API 키를 입력하세요",true);return}
  if(!current)newConvo();

  const model=S.model;current.model=model;
  const userParts=[];
  pending.forEach(p=>userParts.push({inlineData:{mimeType:p.mimeType,data:p.data},_name:p.name}));
  if(text)userParts.push({text});
  current.messages.push({role:"user",parts:userParts});

  // reset composer
  $("input").value="";autosize();pending=[];renderPending();updateSend();
  renderThread();scrollBottom();
  await persist();
  if(!current.title&&text){autoTitle(text)}

  // assistant placeholder
  const th=$("thread");const {m,b}=msgNode("model");
  const content=el("div","content cursor");b.appendChild(content);
  const thinking=el("div","thinking");thinking.innerHTML='<span class="dot"></span>생각 중…';
  b.appendChild(thinking);
  th.appendChild(m);scrollBottom();

  streaming=true;controller=new AbortController();setSendMode(true);
  const collected=[];let acc="";
  const flush=()=>{content.innerHTML=renderMarkdown(acc);enhanceCode(content);};

  try{
    const contents=buildContents();
    if(isImageModel(model)){
      const parts=await callImage(model,contents,controller.signal);
      thinking.remove();content.classList.remove("cursor");content.remove();
      partsToHTML(parts,b);
      collected.push(...parts.map(p=>p.text?{text:p.text}:{inlineData:p.inlineData}));
    }else{
      thinking.remove();
      await callStream(model,contents,(d)=>{
        if(d.text){acc+=d.text;flush();scrollBottom();collected._t=acc}
        else if(d.inlineData){collected.push({inlineData:d.inlineData})}
      },controller.signal);
      content.classList.remove("cursor");
      if(acc){flush();collected.unshift({text:acc})}
      else if(!collected.length){content.textContent="(빈 응답)"}
    }
    // normalize collected for storage
    let storeParts=[];
    if(isImageModel(model)){storeParts=collected}
    else{
      storeParts=[];if(acc)storeParts.push({text:acc});
      collected.forEach(p=>{if(p.inlineData)storeParts.push(p)});
      if(!storeParts.length)storeParts=[{text:"(빈 응답)"}];
    }
    current.messages.push({role:"model",parts:storeParts});
    await persist();
  }catch(err){
    thinking.remove();content.classList.remove("cursor");
    const isAbort=err.name==="AbortError";
    if(isAbort){
      if(acc){current.messages.push({role:"model",parts:[{text:acc+"\n\n_(중단됨)_"}]});await persist()}
      else{content.remove();m.remove()}
    }else{
      content.innerHTML='<div style="color:var(--danger)">⚠ 오류: '+escapeHtml(err.message)+'</div>';
      toast("요청 실패: "+err.message,true);
      // roll back user turn stays; do not store assistant
    }
  }finally{
    streaming=false;controller=null;setSendMode(false);
    updateSend();
  }
}
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* auto title via cheap model */
async function autoTitle(firstMsg){
  const cheap=S.models.find(m=>/lite/i.test(m))||S.models.find(m=>/flash/i.test(m)&&!isImageModel(m))||S.model;
  try{
    const url=API_BASE+encodeURIComponent(cheap)+":generateContent?key="+encodeURIComponent(S.apiKey);
    const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{role:"user",parts:[{text:"다음 대화의 제목을 한국어로 아주 짧게(5단어 이내, 따옴표·마침표 없이) 지어줘:\n\n"+firstMsg}]}],generationConfig:{maxOutputTokens:20,temperature:0.3}})});
    if(!resp.ok)return;
    const j=await resp.json();
    let t=(j?.candidates?.[0]?.content?.parts?.[0]?.text||"").trim().replace(/["'.\n]/g,"").slice(0,40);
    if(t&&current&&!current.title){current.title=t;await persist()}
  }catch{}

["dragover","dragenter"].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault()}));
wrap.addEventListener("drop",e=>{e.preventDefault();if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

  renderModelSel();renderSessions();renderThread();updateBadge();updateSend();
  if(!S.apiKey){setTimeout(openSettings,300)}
})();
</script>
